# Netlify Build & Deploy Configuration
# Documentation: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Directory to deploy (relative to repository root)
    publish = "."
      # Build command (optional - since this is a static site, no build needed)
        # command = "npm run build"

        [build.environment]
          # Build environment variables can be set here
            # NODE_ENV = "production"

            # Redirect rules
            [[redirects]]
              from = "/*"
                to = "/index.html"
                  status = 200

                  # Custom headers
                  [[headers]]
                    for = "/**"
                      [headers.values]
                          Cache-Control = "public, max-age=3600"

                          # Custom headers for specific file types
                          [[headers]]
                            for = "/*.js"
                              [headers.values]
                                  Cache-Control = "public, max-age=31536000, immutable"

                                  [[headers]]
                                    for = "/*.css"
                                      [headers.values]
                                          Cache-Control = "public, max-age=31536000, immutable"

                                          # Context-specific settings
                                          [context.production]
                                            environment = { NODE_ENV = "production" }

                                            [context.develop]
                                              environment = { NODE_ENV = "development" }

                                              [context."deploy-preview"]
                                                environment = { NODE_ENV = "development" }
                                                
